[identity]
module_id = "rpiplc-19r-01"
site_id = "concha-y-toro-piloto"

[plc]
# Hardware confirmado por etiqueta: REF 012002000100, Raspberry PLC 19R V6.
# La microSD usa librpiplc 4.1.0 y python3-librpiplc 4.0.1.
version = "RPIPLC_V6"
model = "RPIPLC_19R"
pump_relay = "R0.1"

[control]
start_timeout_seconds = 60
k24_inactivity_seconds = 40
ble_loss_seconds = 20
nfc_debounce_milliseconds = 300
# Respaldo fail-safe: debe superar holgadamente el heartbeat RFID de 1 s.
nfc_presence_timeout_milliseconds = 2500

[k24]
# Contacto Reed pasivo mediante una interfaz de pulsos de alta impedancia cuya
# salida 5-24 Vdc alimenta la entrada aislada I0.0 respecto de (-)I0.0.
# No conectar el Reed directamente a Vdc. La entrada quedó validada en terreno:
# reposo HIGH y 393 pulsos activos en LOW durante la prueba con aire.
# Se conserva el ajuste de terreno leído el 08/09/2026: 90 pulsos/L.
# No sustituirlo por el nominal de 100 al desplegar; requiere contraste con patrón.
enabled = true
input_pin = "I0.0"
active_low = true
poll_interval_milliseconds = 1.0
debounce_milliseconds = 1.5
pulses_per_liter = 90.0

[database]
path = "/var/lib/fuel-edge/edge.db"

[web_sync]
# Activar después de provisionar web-auth.env y web-sensor.key con la misma ejecución.
enabled = true
base_url = "http://127.0.0.1:8080"
sensor_key_path = "/etc/fuel-edge/web-sensor.key"
request_timeout_seconds = 3.0
retry_seconds = 5.0

[tank_level]
# PIUSI OCIO: 4-20 mA hacia el módulo convertidor instalado; su salida calibrada
# es 0.00 V = 0 % y 9.80 V = 100 %, conectada a I0.2. Este fondo de escala
# corresponde a la calibración de terreno del conjunto OCIO + convertidor.
# El 19R V6 recibe sólo la salida de tensión del convertidor, nunca el lazo de
# corriente directamente.
enabled = true
source = "plc_analog"
telemetry_source = "PIUSI OCIO 4-20 mA vía convertidor 0-9.80 V"
capacity_liters = 2662.0
volume_conversion = "fm2500_field_20260909"
ocio_output_mode = "linear_height"
ocio_height_at_zero_percent_mm = 17.86111111111103
ocio_height_at_full_percent_mm = 1467.0361111111115
ocio_calibration_pending = true
# Curva de terreno Copec 09-09-2026: 869 L + 1793 L = 2662 L a 1220 mm.
# Señales filtradas: 2,854700855 V = 440 mm; 8,129426129 V = 1220 mm.
# Dos referencias: h(mm) = 17,861111111 + 147,875 * U(V).
# Los extremos efectivos de software no cambian HEIGHT=1300 mm en el OCIO.
# El certificado durable de la base productiva habilita esta configuración;
# pending=true conserva el estado seguro en instalaciones sin ese certificado.
# Resolución de 10 mm aplicada DESPUÉS del filtro. Fabricante bajo 440 mm.
# Estos valores corresponden al 0/100 % eléctrico, no a las dimensiones externas
# del estanque. No interpretar una salida proporcional a volumen como altura.
# Ver docs/calibracion-final-copec-20260909.md. Es específico de este estanque.
input_pin = "I0.2"
signal_mode = "0-10v"
input_empty_volts = 0.0
input_full_volts = 9.80
adc_full_scale = 4095
sample_count = 5
deadband_percent = 0.1
publish_interval_seconds = 60.0
# Filtro temporal activo: una muestra por segundo, meseta dominante en 120 s,
# seguida por 15 s sin excursiones. 0,25 % = 6,25 L con volumen lineal de 2500 L.
# No promedia dos escalones 440/450 mm como si fueran una lectura precisa.
# No supone una frecuencia fija del compresor: ajustar con el registro de volts.
cycle_filter_enabled = true
cycle_window_seconds = 120.0
cycle_quiet_seconds = 15.0
cycle_band_percent = 0.25
cycle_support_fraction = 0.8
# Parámetros heredados usados solamente si se deshabilita cycle_filter_enabled.
stability_seconds = 15.0
stability_band_percent = 0.25

[validator]
# El servicio valida certificados TLS y registro 0600 antes de tocar hardware.
enabled = true
validator_id = "validator-01"
registry_path = "/etc/fuel-edge/validator-registry.toml"
# Fuente protegida que la Raspberry distribuye automáticamente a los
# validadores por MQTT/TLS. Admite hasta 32 MIM activos por validador.
equipment_registry_path = "/etc/fuel-edge/equipment-registry.toml"
proof_timeout_seconds = 5.0

[validator.mqtt]
host = "127.0.0.1"
port = 8883
ca_certificate = "/etc/fuel-edge/tls/ca.crt"
client_certificate = "/etc/fuel-edge/tls/rpi.crt"
client_key = "/etc/fuel-edge/tls/rpi.key"
